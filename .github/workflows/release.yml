name: Release to Nuget

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-*"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # lets the job get an OIDC token for NuGet Trusted Publishing
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history, so the tagged commit can be checked against main
    - name: Verify commit exists in origin/main
      run: git merge-base --is-ancestor HEAD origin/main
    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION}
    - name: Pack
      run: dotnet pack --configuration Release /p:Version=${VERSION} --no-build --output .
    - name: NuGet login (OIDC to short-lived API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: anm  # nuget.org profile name that owns the Trusted Publishing policy
    - name: Push
      run: dotnet nuget push UmbracoExternalStorageWithMongoDB.${VERSION}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
